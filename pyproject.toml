[project]
name = "ratel"
version = "0.1.0"
description = "Shared channel for coding agents + read-only board for the human"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.12"
authors = [{ name = "Luke Venediger" }]
keywords = ["agents", "multi-agent", "channel", "mcp", "board", "zellij"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["mcp>=2.1,<3", "textual>=6,<7"]

[project.urls]
Homepage = "https://github.com/lukevenediger/ratel-agent-harness"
Repository = "https://github.com/lukevenediger/ratel-agent-harness"
Issues = "https://github.com/lukevenediger/ratel-agent-harness/issues"

[project.scripts]
ratel = "ratel.cli:main"
ratel-mcp = "ratel.mcp_server:main"
ratel-unread = "ratel.unread:main"
ratel-board = "ratel.board:main"
ratel-tui = "ratel.tui.main:main"
ratel-fake-harness = "ratel.clan.fake_harness:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Tests build compact one-line fixture statements and place imports after the
# helpers they support; long test-data strings are not worth reformatting.
"tests/**" = ["E501", "E701", "E702", "E402", "F841"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ratel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm and not headless'"
markers = [
  "herdr: needs the real herdr binary; skipped when it is missing",
  "zellij: needs the real zellij binary; skipped when it is missing",
  "node: needs the node binary to run the board's md() directly; skipped when it is missing",
  "llm: spends real model tokens against a sandbox repo; opt in with -m llm",
  "headless: runs the real claude/opencode binary once; opt in with -m headless",
]
