/* ---- role detail dialog -------------------------------------------- */
const elRoleDialog = $("#roleDialog");
let roleDialogLock = null;

function roleAge(generated, since) {
  const g = Date.parse(generated), s = Date.parse(since);
  if (!isFinite(g) || !isFinite(s)) return "";
  const secs = Math.max(0, Math.round((g - s) / 1000));
  if (secs < 60) return secs + "s";
  if (secs < 3600) return Math.round(secs / 60) + "m";
  return Math.round(secs / 3600) + "h";
}

function newestMessage(msgs, pred) {
  let best = null;
  for (const m of msgs) if (pred(m) && (!best || m.id > best.id)) best = m;
  return best;
}

// Everything the operator needs before going to look at the tab. Both messages
// render through messageNode(), so they inherit md(), attachments and escaping.
function openRole(name) {
  const model = S.clan;
  const r = model && (model.roles || []).find(x => x.role === name);
  if (!r) return;
  elRoleDialog.querySelector(".rtitle").textContent = name;
  const body = elRoleDialog.querySelector(".rbody");
  body.replaceChildren();
  const dl = document.createElement("dl");
  dl.className = "rfacts";
  const fact = (k, v) => {
    const dt = document.createElement("dt");
    dt.textContent = k;
    const dd = document.createElement("dd");
    dd.textContent = v == null || v === "" ? "\u2014" : String(v);
    dl.append(dt, dd);
  };
  const age = roleAge(model.generated, r.since);
  fact("state", stateLabel(r.state, r.headless) + (age ? " for " + age : ""));
  if (r.awaiting) fact("waiting on", r.awaiting.text);   // textContent, like every fact
  fact("confidence", r.confidence);
  fact("harness", r.harness);
  fact("model", r.model);
  fact("writer", r.writer ? "yes" : "no");
  fact("branch", r.branch);
  fact("worktree", r.worktree);
  fact("tab / pane", [r.tab_id, r.pane_id].filter(x => x != null).join(" / "));
  body.appendChild(dl);
  if (r.reasons && r.reasons.length) {
    const ul = document.createElement("ul");
    ul.className = "rreasons";
    for (const reason of r.reasons) {
      const li = document.createElement("li");
      li.textContent = reason;                       // verbatim, from the closed vocabulary
      ul.appendChild(li);
    }
    body.appendChild(ul);
  }
  const ctx = document.createElement("div");
  ctx.className = "rctx";
  ctx.textContent = "context " + (r.context_tokens == null ? "?" : r.context_tokens.toLocaleString())
    + " / " + (r.checkpoint_at == null ? "?" : r.checkpoint_at.toLocaleString())
    + (r.last_checkpoint ? " \u00b7 last checkpoint " + r.last_checkpoint : "");
  body.appendChild(ctx);
  const msgs = Array.from(S.byId.values());
  const mention = newestMessage(msgs, m => m.from !== name && (m.mentions || []).includes(name));
  const own = newestMessage(msgs, m => m.from === name);
  const section = (label, m) => {
    const h = document.createElement("div");
    h.className = "rlabel";
    h.textContent = label;
    body.appendChild(h);
    if (m) {
      body.appendChild(messageNode(m, false));
    } else {
      const p = document.createElement("p");
      p.className = "rempty";
      p.textContent = "none on the bus yet";
      body.appendChild(p);
    }
  };
  section("newest mention of " + name, mention);
  section("newest post by " + name, own);
  if (!elRoleDialog.open) {
    elRoleDialog.showModal();
    if (PHONE_MQ.matches) {
      roleDialogLock = document.body.style.overflow;
      document.body.style.overflow = "hidden";
    }
  }
}

if (elRoleDialog) {
  elRoleDialog.querySelector(".close").addEventListener("click", () => elRoleDialog.close());
  elRoleDialog.addEventListener("close", () => {
    elRoleDialog.querySelector(".rbody").replaceChildren();
    if (roleDialogLock !== null) {
      document.body.style.overflow = roleDialogLock;
      roleDialogLock = null;
    }
  });
}
/* ---- end team map ---- */

/* ---- clan signature refresh ---------------------------------------- */
// The SSE `clan` event carries a signature, not the payload. Coalesce a burst
// into one refetch so the expensive model runs once per change, not per client
// per tick.
let clanRefreshTimer = 0;
function scheduleClanRefresh() {
  if (clanRefreshTimer) return;
  clanRefreshTimer = setTimeout(() => {
    clanRefreshTimer = 0;
    refreshClan(true);
  }, 250);
}

/* ---- channels ------------------------------------------------------ */
// Build one sidebar row. The server has already validated `repo`; the name,
// repo and checkout still go through textContent (never innerHTML), and the
// checkout is never an href.
function channelButton(c) {
  const b = document.createElement("button");
  b.dataset.channel = c.name;
  b.className = c.name === S.channel ? "active" : "";
  if (c.last_ts) b.title = c.name + " · last activity " + c.last_ts;
  const top = document.createElement("span");
  top.className = "top";
  const nm = document.createElement("span");
  nm.className = "nm";
  nm.textContent = c.name;
  const n = document.createElement("span");
  n.className = "n";
  n.textContent = c.count;
  top.append(nm, n);
  b.appendChild(top);
  const meta = channelMeta(c);
  if (meta) b.appendChild(meta);
  b.addEventListener("click", () => selectChannel(c.name));
  return b;
}

// The secondary line under the name: repo slug + shortened checkout. Null when
// the channel has no clan, so a plain channel keeps its one-line row.
function channelMeta(c) {
  const repo = c.repo, checkout = shortenPath(c.checkout);
  if (!repo && !checkout) return null;
  const meta = document.createElement("span");
  meta.className = "meta";
  if (repo) {
    const r = document.createElement("span");
    r.className = "repo";
    r.textContent = repo;
    meta.appendChild(r);
  }
  if (checkout) {
    const p = document.createElement("span");
    p.className = "co";
    p.textContent = checkout;
    meta.appendChild(p);
  }
  return meta;
}

// A checkout path shown `~`-relative and middle-ellipsised: on a worktree the
// tail (the repo directory) is the informative part, so a long path keeps it.
function shortenPath(p, max) {
  if (!p) return "";
  p = String(p).replace(/^\/(?:Users|home)\/[^/]+\//, "~/");
  max = max || 22;
  if (p.length <= max) return p;
  const head = Math.ceil((max - 1) / 2);
  return p.slice(0, head) + "\u2026" + p.slice(-(max - 1 - head));
}

// Re-render from S.channels, in activity order. Callable again: a live message
// re-sorts the list without a reload. The selected row's active state, focus
// and scroll position all survive the rebuild.
function renderChannels() {
  const focused = elChannels.contains(document.activeElement)
    ? document.activeElement.dataset.channel : null;
  const sidebarTop = elSidebar ? elSidebar.scrollTop : 0;
  const rowLeft = elChannels.scrollLeft;
  const sorted = S.channels.slice().sort(
    (a, b) => (b.last_id || "").localeCompare(a.last_id || ""));
  elChannels.replaceChildren(...sorted.map(channelButton));
  if (elSidebar) elSidebar.scrollTop = sidebarTop;
  elChannels.scrollLeft = rowLeft;
  if (focused) {
    // match by dataset, not a built selector: a channel name is not trusted to
    // be CSS-safe if a directory appeared outside `clan new`
    const b = [...elChannels.children].find(x => x.dataset.channel === focused);
    if (b) b.focus({ preventScroll: true });
  }
}

// A live message moved its channel to the top: raise its count and last id,
// then re-sort. The count mirrors the server's (all messages, replies too).
function bumpChannel(m) {
  const c = S.channels.find(x => x.name === S.channel);
  if (!c) return;
  c.count += 1;
  c.last_id = m.id;
  c.last_ts = m.ts;
  renderChannels();
}

async function refreshPins() {
  const generation = S.generation, request = ++S.pinGeneration;
  try {
    const d = await fetchJSON("/api/channels/" + encodeURIComponent(S.channel) + "/pins", S.controller.signal);
    if (generation !== S.generation || request !== S.pinGeneration) return;
    S.newestProposal[S.channel] = d.heads.proposed;
    S.approvedProposal[S.channel] = d.heads.approved;
    renderPins(d.pins); refreshClanHeads();
  } catch (error) {
    if (generation === S.generation && request === S.pinGeneration && error.name !== "AbortError")
      connectionStatus("Pinned messages unavailable.", refreshPins);
  }
}

// Per-role context meters from the clan endpoint. One track per role; the
// fill is tokens over checkpoint_at, red (--status-closed) past the line.
// A channel without a clan returns {"roles": []}: the block stays hidden.
let clanFetchedAt = 0;
async function refreshClan(force) {
  // throttle: one measurement per 10 s at most — every SSE tick is too often
  const now = Date.now();
  if (!force && now - clanFetchedAt < 10000) return;
  clanFetchedAt = now;
  if (!S.channel) return;
  const generation = S.generation, request = ++S.clanGeneration;
  try {
    const d = await fetchJSON("/api/channels/" + encodeURIComponent(S.channel) + "/clan", S.controller.signal);
    if (generation !== S.generation || request !== S.clanGeneration) return;
    paintMap(d);                    // one fetch feeds both the meter and the map
    const roles = d.roles || [];
    elClanMeter.hidden = !roles.length;
    elClanMeter.replaceChildren(...roles.map(r => {
      const over = r.context_tokens != null && r.context_tokens > r.checkpoint_at;
      const pct = r.context_tokens == null || !r.checkpoint_at ? 0
        : Math.min(100, r.context_tokens / r.checkpoint_at * 100);
      const div = document.createElement("div");
      div.className = "meter" + (over ? " over" : "");
      div.title = r.context_tokens == null ? r.role + ": ? tokens"
        : r.role + ": " + r.context_tokens.toLocaleString() + " / "
          + r.checkpoint_at.toLocaleString() + " tokens";
      const track = document.createElement("span");
      track.className = "track";
      const fill = document.createElement("span");
      fill.style.width = pct + "%";
      track.appendChild(fill);
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = r.role;
      div.append(track, nm);
      return div;
    }));
  } catch { if (generation === S.generation && request === S.clanGeneration) elClanMeter.hidden = true; }
}

async function selectChannel(ch, route={}) {
  if (!/^[A-Za-z0-9_.-]+$/.test(ch) || ch === "." || ch === "..") return;
  if (S.controller) S.controller.abort();
  const controller = S.controller = new AbortController(), generation = ++S.generation;
  if (S.es) { S.es.close(); S.es = null; }
  if (clanRefreshTimer) { clearTimeout(clanRefreshTimer); clanRefreshTimer = 0; }
  clanFetchedAt = 0;
  closeThread(false);
  Object.assign(S, { channel: ch, seen: new Set(), last: "", byId: new Map(), kids: new Map(), agents: new Set(), lastDay: "",
                    nextBefore:null, paging:false, filters:{query:route.query || "", mention:route.mention || "", operator:!!route.operator} });
  closePreview();
  paintMap(null);
  elChanname.textContent = "#" + ch;
  elMessages.innerHTML = ""; elPins.innerHTML = ""; elPresence.innerHTML = "";
  elProgress.hidden = true; elClanMeter.hidden = true;
  elFilter.innerHTML = '<option value="">everyone</option>';
  if (S.filters.mention) { S.agents.add(S.filters.mention); elFilter.add(new Option("@" + S.filters.mention, S.filters.mention)); }
  elFilter.value = S.filters.mention;
  elSearch.value = S.filters.query; elOperator.checked = S.filters.operator;
  elOlder.hidden = true; $("#historyStatus").textContent = "";
  saveRoute(route.thread);
  renderChannels();
  connectionStatus("Loading messages…");
  const current = () => generation === S.generation;
  try {
    const d = await fetchJSON(historyURL(), controller.signal);
    if (!current()) return;
    S.newestProposal[ch] = d.heads.proposed; S.approvedProposal[ch] = d.heads.approved;
    for (const m of d.messages) ingest(m, false, true);
    S.last = d.tip || ""; S.nextBefore = d.next_before;
    elOlder.hidden = !S.nextBefore; elOlder.disabled = false;
    renderChannels();
    refreshPins(); refreshClan(true);
    if (!d.messages.length) {
      const empty = document.createElement("div"); empty.className = "empty-row";
      empty.textContent = "No matching messages."; elMessages.appendChild(empty);
    }
    if (route.thread) openThread(route.thread);
    connectStream(generation);
  } catch (error) {
    if (current() && error.name !== "AbortError")
      connectionStatus("Could not load messages.", () => selectChannel(ch, route));
  }
}

function connectStream(generation) {
  if (generation !== S.generation) return;
  if (S.es) S.es.close();
  const es = S.es = new EventSource("/api/channels/" + encodeURIComponent(S.channel) + "/events?since=" + encodeURIComponent(S.last));
  const current = () => generation === S.generation && S.es === es;
  connectionStatus("Connecting…");
  es.onopen = () => { if (current()) connectionStatus("Live"); };
  es.onerror = () => { if (current()) connectionStatus("Connection lost. Reconnecting…", () => connectStream(generation)); };
  for (const event of ["hello", "presence"]) es.addEventListener(event, e => {
    if (current()) renderPresence(JSON.parse(e.data).presence);
  });
  es.addEventListener("clan", () => { if (current()) scheduleClanRefresh(); });
  es.addEventListener("message", e => {
    if (!current()) return;
    const m = JSON.parse(e.data);
    S.last = m.id;
    if (!ingest(m, true)) return;
    if (m.pin || "unpin" in m || (m.attachments || []).some(a => inferType(a) === "clan")) refreshPins();
    refreshClan();
  });
}

async function loadOlder() {
  if (S.paging || !S.nextBefore) return;
  const generation = S.generation;
  S.paging = true; elOlder.disabled = true; $("#historyStatus").textContent = "Loading…";
  const anchor = elMessages.querySelector(".msg:not([hidden])");
  const top = anchor && anchor.getBoundingClientRect().top;
  try {
    const d = await fetchJSON(historyURL(S.nextBefore), S.controller.signal);
    if (generation !== S.generation) return;
    // Render the older page separately, then prepend it without moving existing nodes.
    const existing = [...elMessages.childNodes];
    existing.forEach(node => node.remove());
    const lastDay = S.lastDay;
    S.lastDay = "";
    for (const m of d.messages) ingest(m, false, true);
    elMessages.append(...existing); S.lastDay = lastDay;
    S.nextBefore = d.next_before; elOlder.hidden = !S.nextBefore;
    applyFilter();
    if (anchor) window.scrollBy(0, anchor.getBoundingClientRect().top - top);
    $("#historyStatus").textContent = S.nextBefore ? "" : "Beginning of matching history";
  } catch (error) {
    if (generation === S.generation && error.name !== "AbortError")
      $("#historyStatus").textContent = "Could not load older messages. Try again.";
  } finally {
    if (generation === S.generation) { S.paging = false; elOlder.disabled = false; }
  }
}
elOlder.addEventListener("click", loadOlder);

let bootGeneration = 0;
async function boot() {
  const request = ++bootGeneration;
  const q = new URLSearchParams(location.search);
  if (q.get("token")) {
    storeToken(q.get("token"));
    q.delete("token");                     // the token must not sit in the address bar
    history.replaceState(null, "", location.pathname +
      (q.toString() ? "?" + q : "") + location.hash);
  } else {
    try { S.token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  }
  let channels;
  connectionStatus("Loading channels…");
  try { ({channels} = await fetchJSON("/api/channels")); }
  catch { if (request === bootGeneration) connectionStatus("Could not load channels.", boot); return; }
  if (request !== bootGeneration) return;
  if (!channels.length) {
    connectionStatus("No channels yet");
    elMessages.innerHTML = '<p style="color:var(--text-muted)">No channels yet. Start an agent and post to one.</p>';
    return;
  }
  S.channels = channels;
  renderChannels();                        // the server already ordered them; sort again anyway
  const route = readRoute();
  selectChannel(route.channel || channels[0].name, route);
}
boot();
</script>
