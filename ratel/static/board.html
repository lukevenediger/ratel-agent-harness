<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ratel</title>
<link rel="icon" href="data:,">
<style>
  /* ---- design tokens v2.1 — dark default, light via OS ---------------- */
  :root {
    color-scheme: dark;
    --bg-sidebar: #0A0E14;
    --bg-app:     #12161D;
    --bg-card:    #171C24;
    --bg-hover:   #1A202A;
    --bg-field:   #0D1118;
    --border:     #262D38;
    --outline:    #5B6D85;
    --text-primary:   #E9EDF3;
    --text-secondary: #A8B3C4;
    --text-muted:     #8A94A8;
    --accent:         #4CC2FF;
    --accent-dim: rgba(76, 194, 255, 0.14);
    --shadow-panel: 0 8px 32px rgba(0, 0, 0, 0.45);
    --a1:#82A7FF; --a2:#FF7A76; --a3:#3FD9C4; --a4:#FFD43B;
    --a5:#C0A6FF; --a6:#6FDD8B; --a7:#FFA94D; --a8:#FF7ABF;
    --c1:#242D41; --c2:#38262B; --c3:#193538; --c4:#383422;
    --c5:#2E2D41; --c6:#21362F; --c7:#382E25; --c8:#382637;
    --status-open:#6FDD8B; --status-merged:#C0A6FF; --status-closed:#FF7A76;
    /* the one LAYOUT token here — every other custom property below is a
       colour or a font. The thread panel and #content's padding both read it,
       so the two can never drift apart; the drag handle writes it. */
    --thread-width: 400px;
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg-sidebar: #F0F2F5;
      --bg-app:     #FFFFFF;
      --bg-card:    #F6F8FA;
      --bg-hover:   #EDF1F5;
      --bg-field:   #FFFFFF;
      --border:     #D9E0E8;
      --outline:    #64748B;
      --text-primary:   #182030;
      --text-secondary: #46536B;
      --text-muted:     #5E6B80;
    --accent:         #0A66C2;
    --accent-dim: rgba(10, 102, 194, 0.10);
    --shadow-panel: 0 8px 32px rgba(23, 32, 48, 0.14);
    --a1:#2B50C8; --a2:#B83526; --a3:#0B7266; --a4:#7A5F00;
    --a5:#6448BC; --a6:#1B7439; --a7:#A84C00; --a8:#B52255;
    --c1:#EAEEFA; --c2:#F8EBE9; --c3:#E7F1F0; --c4:#F2EFE6;
    --c5:#F0EDF8; --c6:#E8F1EB; --c7:#F6EDE6; --c8:#F8E9EE;
    --status-open:#1B7439; --status-merged:#6448BC; --status-closed:#B83526;
  }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg-app);
    color: var(--text-primary);
    font: 15px/1.55 var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- shell ----------------------------------------------------------- */
  #shell { display: flex; min-height: 100vh; }
  #sidebar {
    flex: none; width: 240px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 14px 0 24px;
    overflow-y: auto;
  }
  #sidebar .brand {
    font: 600 15px/1.2 var(--font-sans);
    color: var(--text-primary);
    padding: 2px 20px 12px;
  }
  #sidebar .label, .section-label {
    font: 600 11px/1.2 var(--font-mono);
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-muted);
    padding: 12px 20px 6px;
  }
  #content { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ---- top bar --------------------------------------------------------- */
  #topbar {
    position: sticky; top: 0; z-index: 5;
    flex: none;
    height: 56px;
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
    background: var(--bg-app);
    border-bottom: 1px solid var(--border);
  }
  #channame {
    margin: 0; flex: 1; min-width: 0;
    font: 600 15px/1.3 var(--font-mono);
    color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* header progress: the newest pinned `tasks` checklist, always in view */
  #progress {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 4px;
    font: 600 11px/1.2 var(--font-mono); color: var(--text-muted);
    background: none; border: 0; border-radius: 4px;
    cursor: pointer; white-space: nowrap;
  }
  #progress[hidden] { display: none; }
  #progress:hover { color: var(--text-secondary); }
  #progress .progress { width: 120px; flex: none; }
  /* per-role context meters: one track per clan role, filled from /clan */
  #clanMeter { display: flex; align-items: center; gap: 8px; }
  #clanMeter[hidden] { display: none; }
  #clanMeter .meter { display: flex; align-items: center; gap: 4px;
    font: 600 11px/1.2 var(--font-mono); color: var(--text-muted); }
  #clanMeter .meter .track { width: 40px; height: 5px; flex: none;
    background: var(--border); border-radius: 3px; overflow: hidden; }
  #clanMeter .meter .track span { display: block; height: 100%;
    background: var(--accent); border-radius: 3px; }
  #clanMeter .meter.over .track span { background: var(--status-closed); }
  #filter {
    flex: none;
    height: 32px;
    font: 12px var(--font-mono);
    color: var(--text-secondary);
    background: var(--bg-field);
    border: 1px solid var(--outline); border-radius: 8px;
    padding: 0 8px;
  }

  /* ---- sidebar channel rows + agents ----------------------------------- */
  #channels { display: flex; flex-direction: column; gap: 1px; padding: 0 8px; }
  #channels button {
    display: flex; flex-direction: column; justify-content: center; gap: 1px;
    width: 100%; min-height: 32px;
    padding: 5px 12px;
    font: 500 14px/1.2 var(--font-sans);
    color: var(--text-secondary);
    background: none; border: 0; border-radius: 4px;
    cursor: pointer; text-align: left;
  }
  #channels button .top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  #channels button .nm {
    min-width: 0;
    font-family: var(--font-mono); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #channels button .n { flex: none; margin-left: auto; font: 600 11px var(--font-mono); color: var(--text-muted); }
  /* the metadata line: secondary text, one line, never competing with the name.
     repo and checkout both shrink; the checkout is middle-ellipsised in JS so
     its tail (the directory) survives. */
  #channels button .meta {
    display: flex; align-items: baseline; gap: 6px; min-width: 0; overflow: hidden;
    font: 400 11px/1.3 var(--font-mono); color: var(--text-muted);
  }
  #channels button .meta .repo,
  #channels button .meta .co {
    flex: 0 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #channels button:hover { background: var(--bg-hover); }
  #channels button.active {
    background: var(--bg-hover); color: var(--text-primary);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  #presence { display: flex; flex-direction: column; gap: 1px; padding: 0 8px; }
  #presence .agent-row {
    display: flex; align-items: center; gap: 8px;
    height: 28px; padding: 0 12px;
    font: 400 13px/1.2 var(--font-mono);
    color: var(--text-secondary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #presence .dot {
    flex: none; width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; opacity: .35;
  }
  #presence .agent-row.online .dot {
    opacity: 1;
    box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 20%, transparent);
  }
  #presence .agent-row.offline { color: var(--text-muted); }
  #presence .dot.alt { outline: 1px dotted currentColor; outline-offset: 1px; }
  .msg .foot .dot.alt { outline: 1px dotted currentColor; outline-offset: 1px; }

  /* ---- team map --------------------------------------------------------- */
  #mapPanel { padding: 0 8px 4px; }
  #mapPanel .maphead {
    display: flex; align-items: center; gap: 6px;
    width: 100%; padding: 4px 12px;
    background: none; border: 0; border-radius: 4px;
    font: 600 11px/1.2 var(--font-mono); letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-muted); cursor: pointer;
  }
  #mapPanel .maphead:hover { color: var(--text-secondary); }
  #mapPanel .maphead .chev { display: inline-block; transition: transform 0.12s ease; }
  #mapPanel.collapsed .maphead .chev { transform: rotate(-90deg); }
  #mapPanel.collapsed .mapbox { display: none; }
  #mapPanel .mapbox { padding: 2px 4px 6px; }
  #map { display: block; width: 100%; height: auto; }
  #map text { font: 600 9px var(--font-mono); fill: var(--text-secondary); }
  #map .node-label { text-anchor: middle; }
  #map .node-ring { fill: none; }
  #map .node-dot { stroke: var(--bg-sidebar); stroke-width: 1.4; }
  #map .edge { stroke: var(--outline); stroke-width: 1.1; marker-end: url(#mapArrow); }
  #map .edge.waiting { stroke: var(--status-closed); stroke-dasharray: 3 2; }
  #map .node-weak .node-ring { stroke-dasharray: 3 2; }
  #map .node:focus-visible .node-ring { outline: 2px solid var(--accent); }
  #mapBtn { display: none; }
  #mapDialog { padding: 0; border: none; background: var(--bg-app); color: var(--text-primary); }
  #mapDialog::backdrop { background: rgba(0, 0, 0, 0.5); }
  #mapDialog .mhead {
    display: flex; align-items: center; height: 52px; padding: 0 8px 0 14px;
    border-bottom: 1px solid var(--border);
  }
  #mapDialog .mhead .title { flex: 1; font: 600 15px var(--font-sans); }
  #mapDialog .mhead .close {
    min-height: 44px; min-width: 44px; background: none; border: 0;
    color: var(--text-secondary); font-size: 20px; cursor: pointer;
  }
  #mapDialog .mbody { padding: 14px; max-height: calc(100dvh - 52px); overflow-y: auto; }

  /* ---- role detail dialog ----------------------------------------------- */
  #roleDialog {
    width: calc(100vw - 32px); max-width: 560px;
    border: none; border-radius: 12px; padding: 0;
    background: var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow-panel);
  }
  #roleDialog::backdrop { background: rgba(0, 0, 0, 0.5); }
  #roleDialog .rhead {
    display: flex; align-items: center; height: 48px; padding: 0 8px 0 16px;
    border-bottom: 1px solid var(--border);
  }
  #roleDialog .rtitle { flex: 1; min-width: 0; font: 600 15px var(--font-mono);
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #roleDialog .close {
    min-height: 40px; min-width: 40px; background: none; border: 0;
    color: var(--text-secondary); font-size: 20px; cursor: pointer;
  }
  #roleDialog .rbody { padding: 12px 16px; max-height: 70dvh; overflow-y: auto; }
  #roleDialog .rfacts {
    display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px;
    margin: 0 0 10px; font: 400 13px/1.4 var(--font-mono);
  }
  #roleDialog .rfacts dt { color: var(--text-muted); }
  #roleDialog .rfacts dd { margin: 0; color: var(--text-primary); overflow-wrap: anywhere; }
  #roleDialog .rreasons { margin: 0 0 10px; padding-left: 18px;
                          color: var(--text-secondary); font-size: 13px; }
  #roleDialog .rctx { font: 400 12px var(--font-mono); color: var(--text-muted); margin-bottom: 8px; }
  #roleDialog .rlabel {
    font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); margin: 12px 0 4px;
  }
  #roleDialog .rempty { margin: 0; color: var(--text-muted); font-size: 13px; }

  /* ---- content column --------------------------------------------------- */
  #pins { flex: none; background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0 20px; scroll-margin-top: 60px; }
  #pins:empty { display: none; }
  #pins .summary, #pins .pinbody { max-width: 720px; margin: 0 auto; }
  @media (min-width: 701px) {
    body.thread-open #content { padding-right: var(--thread-width); }
    /* fixed, not absolute: it sits over a panel that scrolls its own content,
       and would otherwise scroll away with it */
    body.thread-open #threadResize {
      display: block;
      position: fixed; top: 0; bottom: 0; z-index: 11;
      right: var(--thread-width);
      width: 11px; margin-right: -5px;      /* a grab strip centred on the edge */
      cursor: col-resize;
      touch-action: none;                   /* or a trackpad drag is stolen as a scroll */
      background: transparent;
    }
    #threadResize:hover, #threadResize.dragging { background: var(--accent-dim); }
    #threadResize:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  }
  #messages {
    flex: 1;
    width: 100%; max-width: 760px; margin: 0 auto;
    padding: 8px 20px calc(40vh + 24px);
  }

  /* ---- pins -------------------------------------------------------------- */
  #pins .pin { padding: 10px 0; }
  #pins .pin.collapsed {
    padding: 6px 0 6px 11px;
    color: var(--text-muted); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #pins .older {
    font: 13px var(--font-mono); color: var(--text-muted);
    background: none; border: 0; padding: 6px 0; cursor: pointer;
  }
  #pins .older:hover { color: var(--text-secondary); }
  .pinlabel {
    font: 600 11px/1.2 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 4px; padding-top: 8px;
  }
  #pins .pin.expanded { padding: 0 0 10px; }
  #pins .pin.expanded .msg {
    background: var(--bg-card);
    border: 1px solid var(--outline); border-left: 3px solid var(--border);
    border-radius: 8px; padding: 10px 12px 10px 11px;
  }
  #pins .summary {
    display: none; align-items: center; gap: 10px;
    width: 100%; min-height: 44px;
    background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
  }
  #pins .summary .glyph { flex: none; color: var(--accent); font: 12px var(--font-mono); }
  #pins .summary .cnt { flex: none; font: 600 11px var(--font-mono); color: var(--accent); }
  #pins .summary .sum-title {
    flex: 1; min-width: 0; font: 13px var(--font-sans); color: var(--text-secondary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #pins .summary .chev { flex: none; font: 12px var(--font-mono); color: var(--text-muted); }
  #pins .pinbody { display: block; }

  /* ---- messages (stage-1 restyle; full component pass in stage 2) -------- */
  .msg {
    border-left: 3px solid var(--border);
    padding: 8px 12px 10px 14px;
    margin: 2px 0;
  }
  .msg[hidden] { display: none; }
  .msg .head { display: flex; align-items: baseline; gap: 8px; }
  .msg .from { font: 600 13.5px/1.3 var(--font-mono); }
  .msg time { font: 400 12px/1.3 var(--font-mono); color: var(--text-muted); }
  .msg .body { margin-top: 2px; max-width: 72ch; overflow-wrap: anywhere; }
  .msg.has-replies { cursor: pointer; }
  .msg.has-replies:hover { background: var(--bg-hover); }
  .msg .foot {
    display: flex; align-items: center; gap: 6px;
    margin-top: 6px;
    font: 12px var(--font-mono); color: var(--text-muted);
  }
  .msg .foot:empty { display: none; }
  .msg .foot .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .mention {
    border-radius: 4px; padding: 0 4px;
    font: 500 13px var(--font-mono);
    border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
  }
  .msg.alt { border-left-style: dotted; }
  .msg { transition: border-left-color 150ms; }
  .msg.flash { animation: ruleflash 1.2s linear; }
  @keyframes ruleflash { from, to { border-left-color: var(--accent); } }
  .new-divider {
    display: flex; align-items: center; gap: 12px;
    height: 24px; margin: 2px 0;
    color: var(--accent);
    font: 700 11px/1.2 var(--font-mono); letter-spacing: 0.08em;
  }
  .new-divider::before, .new-divider::after {
    content: ""; flex: 1; height: 1px; background: var(--accent);
  }
  code { font: 13px/1.5 var(--font-mono); background: var(--bg-field); border-radius: 4px; padding: 1px 5px; }
  pre {
    background: var(--bg-field); border: 1px solid var(--outline); border-radius: 8px;
    padding: 11px 13px; margin: 9px 0; overflow-x: auto;
  }
  pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; }
  a { color: var(--accent); text-underline-offset: 2px; }
  ul { margin: 7px 0; padding-left: 20px; }
  ul.checks { list-style: none; padding-left: 2px; }
  ul.checks li { display: flex; gap: 8px; align-items: baseline; min-height: 28px; }
  ul.checks input { accent-color: var(--text-muted); }
  ul.checks input:checked + span { color: var(--text-muted); text-decoration: line-through; }

  /* ---- attachments (stage-1 restyle; full card pass in stage 3) ---------- */
  .atts:empty { display: none; }
  .atts { margin-top: 8px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .card {
    border: 1px solid var(--outline); border-radius: 8px;
    background: var(--bg-card);
    max-width: 100%; overflow: hidden;
  }
  .card .chead {
    display: flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 11px;
    font: 400 12px/1.4 var(--font-mono); color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
  }
  .card .chead .sep { color: var(--text-muted); }
  .card .chead .grow { flex: 1; }
  .card .chead button {
    font: 12px var(--font-mono); color: var(--text-muted);
    background: none; border: 0; cursor: pointer; padding: 0;
  }
  .card .chead button:hover { color: var(--accent); }
  .card pre { margin: 0; border: 0; border-radius: 0; background: none; }
  .card.clipped .cbody { max-height: 250px; overflow: hidden; position: relative; }
  .card.clipped .cbody::after {
    content: ""; position: absolute; inset: auto 0 0 0; height: 46px;
    background: linear-gradient(to bottom, transparent, var(--bg-card));
  }
  .card .cbody { padding: 4px 0; }
  .atts img {
    max-height: 320px; max-width: 100%;
    border: 1px solid var(--outline); border-radius: 8px; display: block;
  }
  .card .row { display: flex; align-items: center; gap: 8px; padding: 8px 11px; min-height: 40px; overflow-x: auto; }
  .card .row > span { font: 13px var(--font-sans); }
  .card ul.checks { margin: 6px 0; padding: 0 11px; }
  .card .who { font: 500 11px var(--font-mono); border-radius: 4px; padding: 0 4px; }
  .card .cfoot { padding: 6px 11px; font: 11px var(--font-mono); color: var(--text-muted); border-top: 1px solid var(--border); }
  .unsafe { color: var(--text-muted); text-decoration: line-through; cursor: not-allowed; }
  .card .meta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 8px 11px; font: 12px var(--font-mono); }
  .card .meta .title { font: 600 14px/1.35 var(--font-sans); color: var(--text-primary); }
  .card .meta a { overflow-wrap: anywhere; }
  .card .row a { overflow-wrap: anywhere; }
  .card .repo { color: var(--text-muted); }
  .badge { border-radius: 4px; padding: 0 6px; font: 600 11px var(--font-mono); }
  .badge.open { color: var(--status-open); background: var(--c6); }
  .badge.merged { color: var(--status-merged); background: var(--c5); }
  .badge.closed { color: var(--status-closed); background: var(--c2); }
  .card .diff .add { color: var(--status-open); }
  .card .diff .del { color: var(--status-closed); }
  .card .checks .ok { color: var(--status-open); }
  .card .checks .bad { color: var(--status-closed); }
  .card .checks .wait { color: var(--text-muted); }
  /* one bar, two homes: the tasks card footer and the header's #progress */
  .progress {
    height: 2px; border-radius: 1px;
    background: var(--border); overflow: hidden;
  }
  .progress span { display: block; height: 100%; background: var(--accent); }
  .card .progress { margin: 0 11px 10px; }
  .card .gdoc-host { font: 400 11px var(--font-mono); color: var(--text-muted); }

  /* ---- separators + empty states ----------------------------------------- */
  .date-sep {
    display: flex; align-items: center; gap: 12px;
    height: 24px; margin: 8px 0 2px;
    font: 500 11px/1.2 var(--font-mono); color: var(--text-muted);
  }
  .date-sep[hidden] { display: none; }
  .date-sep::before, .date-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .empty-row {
    padding: 48px 0 0; min-height: 44px; text-align: center;
    font: 13px var(--font-mono); color: var(--text-muted);
  }

  /* ---- md() block constructs --------------------------------------------- */
  /* Emitted only for a caller that passes { blocks: true }; message bodies
     never see them. Scoped to .mdblocks — a container that turns blocks on MUST
     carry that class or none of this applies — so an agent's `# heading` can
     never compete with the page's own type scale. */
  .mdblocks h1, .mdblocks h2, .mdblocks h3,
  .mdblocks h4, .mdblocks h5, .mdblocks h6 {
    margin: 12px 0 4px; font-weight: 600; line-height: 1.3; color: var(--text-primary);
  }
  .mdblocks h1 { font-size: 17px; }
  .mdblocks h2 { font-size: 15px; }
  .mdblocks h3, .mdblocks h4, .mdblocks h5, .mdblocks h6 { font-size: 14px; }
  .mdblocks ol { margin: 4px 0; padding-left: 22px; }
  .mdblocks blockquote {
    margin: 6px 0; padding: 2px 0 2px 10px;
    border-left: 2px solid var(--border); color: var(--text-secondary);
  }
  .mdblocks hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .mdblocks table { border-collapse: collapse; font-size: 13px; }
  .mdblocks th, .mdblocks td {
    border: 1px solid var(--border); padding: 4px 8px; vertical-align: top;

  /* ---- file preview modal ------------------------------------------------ */

  /* ---- thread panel ------------------------------------------------------ */

  #thread .msg[role="button"] { cursor: default; }

  /* ---- mobile (≤700px) ---------------------------------------------------- */
  @media (max-width: 700px) {
    #sidebar { display: contents; }

    #content { display: contents; }

/* ---- clan card ---------------------------------------------------------- */
  /* the WRAPPER is the scroll container, never the table: `display: block` on a
     table kills table layout, and then no percentage or elastic column width
     has anything to resolve against. Do not move the overflow back. Shared
     with md()'s tables — one pattern, one class. */
  .scrollx { overflow-x: auto; }
  .clancard table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .clancard th, .clancard td {
    text-align: left; padding: 4px 6px;
    border-bottom: 1px solid var(--border); vertical-align: top;
  }
  .clancard .clanin {
    background: var(--bg-field); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 6px; min-height: 40px; font: inherit;
    max-width: 22ch;
  }
  .clancard .clanin:disabled { opacity: .6; }
  .clancard .clanerr { color: var(--status-closed); font-size: 12px; padding: 4px 6px; }
  .clancard .clanx { width: 28px; max-width: 40px; padding: 0; text-align: center; }
  /* the remove control sits beside the name, not above it. The name column is
     the elastic one: it takes the slack the setup control does not need, so a
     packaged role name like `security-reviewer` reads without clicking in.
     There is no slack left at a 1280px window — the name input measures 139px
     against the 137px that name needs — so a column that grows breaks this
     one first, and the widths below have to be re-measured, not eyeballed. */
  .clancard td.namecell { display: flex; gap: 4px; align-items: center; }
  .clancard td.namecell .clanin { max-width: 17ch; flex: 1 1 auto; min-width: 0; }
  /* the preset label ends in the provider and the effort word — the two things
     that tell 1) from 3) — so the setup control is never clipped; the table
     already scrolls sideways when the card cannot hold it */
  .clancard td.setupcell .clanin { max-width: none; }
  .clancard td.l2 .clanin { max-width: 8ch; }
  /* a role is a pair of rows: the border goes under the pair, not between */
  .clancard tr.rolerow td { border-bottom: none; padding-left: 4px; padding-right: 4px; }
  .clancard tr.whyrow td { padding-top: 0; padding-bottom: 8px; color: var(--text-muted); }
  .clancard .clanadd { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; }
  .clancard .clanhint { color: var(--text-muted); font-size: 12px; padding: 4px 6px; }
  .clancard .confirm {
    background: var(--accent-dim); color: var(--accent);
    border: 1px solid var(--accent); border-radius: 8px;
    padding: 10px 16px; min-height: 40px; cursor: pointer; font: inherit;
  }
  .clancard .confirm:disabled { opacity: .5; cursor: default; }

  @media (max-width: 700px) {
    .clancard thead { display: none; }
    /* name and setup take a line each, writer + skills share one, why spans */
    .clancard tbody tr {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 4px 6px; padding: 8px 0;
    }
    .clancard td { display: block; border: none; padding: 2px 4px; }
    /* a preset label is far too long for half a phone: name and setup each
       take the full width, and only writer + skills share a line */
    .clancard td.namecell { display: flex; }
    /* colspan means nothing to a grid container, so `why` still says so itself */
    .clancard td.namecell, .clancard td.setupcell, .clancard td.why { grid-column: 1 / -1; }
    .clancard .clanin,
    .clancard td.namecell .clanin,
    .clancard td.l2 .clanin { max-width: none; width: 100%; }
    /* both of these have to out-specify the rule above, and come after it:
       the radio would stretch into a huge disc, the remove control into a bar */
    .clancard td.l2 input[type="radio"].clanin { width: 24px; min-height: 24px; }
    .clancard td.namecell .clanx { width: 40px; flex: none; }   /* a tap target */
    .clancard .clanadd .clanin { flex: 1 1 100%; }
    .clancard .confirm { width: 100%; }
  }
  #browse { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 20px; }
  #browse input[type=search] { flex:1; min-width:160px; width:100%; max-width:480px; }
  #browse input[type=search], #browse button, #olderMessages, .retry-action {
    background:var(--bg-field); color:var(--text-primary); border:1px solid var(--outline);
    border-radius:5px; padding:10px; min-height:44px; font:inherit;
  }
  #browse label { display:flex; align-items:center; gap:6px; min-height:44px; }
  #connection, #historyControls { padding:6px 20px; color:var(--text-muted); font-size:13px; }
  #connection button { margin-left:12px; }
  #historyControls { display:flex; align-items:center; gap:12px; }
  .thread-link { color:var(--accent); margin-left:auto; }
  @media(max-width:700px) { #browse { padding:10px 12px; } #browse input[type=search] { flex-basis:100%; max-width:none; } }
</style>

  </aside>
  <div id="content">

      <button id="progress" type="button" hidden><span class="cnt"></span><span class="progress"><span></span></span></button>
      <div id="clanMeter" hidden aria-label="Context usage per role"></div>

  <aside id="thread" hidden aria-label="Thread"></aside>
  <!-- a SIBLING of #thread: openThread clears that panel's innerHTML, so a
       handle inside it would be destroyed on every open -->
  <div id="threadResize" role="separator" aria-orientation="vertical"
       aria-controls="thread" aria-label="Resize thread panel" tabindex="0"></div>

         keyboard user cannot scroll it. autofocus: showModal() otherwise lands
         on the first focusable element, which is a link that NAVIGATES AWAY —
         a poor default for the one reader who cannot see where they are, and
